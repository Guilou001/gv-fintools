[project]
name = "gvf"
version = "0.1.0"
description = "Outils partagés du portefeuille : le rapport PDF d'un dépôt, engendré depuis son README"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guillaume Vaudescal" }]
dependencies = [
    "typer>=0.12",
    "typst>=0.11",
]

[project.scripts]
gvf = "gvf.cli:app"

[project.urls]
Homepage = "https://github.com/Guilou001/gv-fintools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gvf"]

[dependency-groups]
dev = ["pypdf>=5.0", "pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
